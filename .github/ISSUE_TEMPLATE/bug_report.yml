name: Bug report
description: Something is wrong — a number looks off, the HUD misbehaves, a page breaks.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Numbers are the whole product, so "it says 12 million but I think it is 8" is a valid and
        useful report. Please do not paste transcripts, prompts or session content — we don't need
        them and they are yours. The figures below are enough.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: TokenDance version
      description: Menu bar → 关于 / About, or the version in the settings page.
      placeholder: "1.3.1"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: "macOS 15.3.1, Apple M2"
    validations:
      required: true

  - type: textarea
    id: agent
    attributes:
      label: Which agent and which source
      description: |
        If it is about a specific agent, the data source page (`http://127.0.0.1:8737/sources`)
        shows the path being read and how many records came from it. The path is the useful part.
      placeholder: |
        Codex, ~/.codex/sessions/**/rollout-*.jsonl
        4080 records, last activity 3 minutes ago
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots are welcome. If you can reproduce it in the dashboard, a picture of the chart is often faster than words.
    validations:
      required: false
