name: Feature request
description: Something the HUD or the dashboard should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to answer?
      description: |
        Describe the question you have, not the button you want. "I want to know which project is
        expensive this month" is more useful than "add a column" — the second is one of several
        ways to get the first.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
    validations:
      required: false
