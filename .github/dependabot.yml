# 依赖更新。对这个项目来说它不只是"保持新鲜"——GitHub 会在仓库的 Security 页显示是否开了
# Dependabot，而一个连依赖更新都不管的仓库，看起来就是没人维护的。
#
# 分组提交：rust-server 的依赖树不小（95 个包），一个一个开 PR 会把 issue 列表刷满，
# 反而显得荒废。一周一次、按种类合成一个 PR。
version: 2
updates:
  - package-ecosystem: cargo
    directory: /rust-server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      rust-deps:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # 工作流里的 action 版本（actions/checkout 之类）也会过期，同样会以 "Node 20 deprecated"
  # 这种形式在某天突然让 CI 变红。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
