<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- TokenDance v6: bigger note blocks, tighter spacing, aligned rows.
       Geometry mirrors scripts/make_icon.py (source of truth). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1722"/>
      <stop offset="1" stop-color="#100d14"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7eb3ff"/><stop offset="1" stop-color="#2f7bf6"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc08a"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ceba5"/><stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b4ff"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="66" y="66" width="892" height="892" rx="198" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>

  <g filter="url(#glow)" opacity="0.5">
    <rect x="260" y="388" width="120" height="120" rx="32" fill="#2f7bf6"/>
    <rect x="388" y="516" width="120" height="120" rx="32" fill="#f97316"/>
    <rect x="516" y="388" width="120" height="120" rx="32" fill="#22c55e"/>
    <rect x="644" y="516" width="120" height="120" rx="32" fill="#8b5cf6"/>
  </g>

  <rect x="260" y="388" width="120" height="120" rx="32" fill="url(#blue)"/>
  <rect x="388" y="516" width="120" height="120" rx="32" fill="url(#orange)"/>
  <rect x="516" y="388" width="120" height="120" rx="32" fill="url(#green)"/>
  <rect x="644" y="516" width="120" height="120" rx="32" fill="url(#purple)"/>
</svg>
